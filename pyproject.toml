[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sub-butler"
version = "0.1.0"
description = "订阅账单自动管家：读取邮箱里的账单邮件，用大模型提取信息，同步到 Notion 订阅库，并在到期前提醒你。"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.25",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
sub-butler = "sub_butler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
